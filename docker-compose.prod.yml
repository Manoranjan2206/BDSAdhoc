# =============================================================================
#  BDSAdhoc Production Stack — Linux VM (Ubuntu 24.04)
#  Namespace:   bdsadhoc-t1-*       (isolated, safe to coexist on shared host)
#  Domain:      app.boldreportsdemo.com
#  Host ports:  8080 -> HTTP  (redirects to HTTPS)
#               8443 -> HTTPS (nginx TLS terminator)
#               5432 -> NOT exposed (internal docker network only)
#  Certs:       user-supplied .pem fullchain + .key, mounted from host
#  Bold BI/Reports: NOT deployed (still cloud-hosted)
# =============================================================================
#  Usage:
#     docker compose -f docker-compose.prod.yml --env-file .env.prod -p bdsadhoc-t1 up -d
# =============================================================================

services:

  # ---------------------------------------------------------------------------
  # 1. PostgreSQL — multi-tenant databases (one DB per tenant)
  #    Auto-seeds on first run from ./sql/*.sql (crm_schema + 4 tenant seeds)
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: bdsadhoc-t1-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_INITDB_ARGS: "-c max_connections=200"
    volumes:
      - bdsadhoc-t1-postgres-data:/var/lib/postgresql/data
      - ./sql:/docker-entrypoint-initdb.d:ro
    networks:
      - bdsadhoc-t1-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    # NOTE: port 5432 is intentionally NOT exposed to the host.
    #       The app talks to postgres over bdsadhoc-t1-net only.

  # ---------------------------------------------------------------------------
  # 2. BDSAdhoc App — .NET 10 backend + React/Vite frontend (single image)
  #    Listens on 8080 INSIDE the docker network only — nginx fronts it.
  # ---------------------------------------------------------------------------
  bdsadhoc:
    image: bdsadhoc-bdsadhoc:latest
    container_name: bdsadhoc-t1-app
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080

      # Postgres connection (read by CrmDataService.GetConnectionString)
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

      # ---- Bold Reports (cloud-hosted) ----
      BoldReports__ReportRootUrl: ${BR_ReportRootUrl}
      BoldReports__ReportsSiteIdentifier: ${BR_SiteIdentifier}
      BoldReports__AdminUser: ${BR_AdminUser}
      BoldReports__AdminPassword: ${BR_AdminPassword}
      BoldReports__EmbedSecret: ${BR_EmbedSecret}

      # ---- Bold BI (cloud-hosted) ----
      BoldBI__ServerUrl: ${BBI_ServerUrl}
      BoldBI__SiteIdentifier: ${BBI_SiteIdentifier}
      BoldBI__AdminUser: ${BBI_AdminUser}
      BoldBI__AdminPassword: ${BBI_AdminPassword}
      BoldBI__EmbedSecret: ${BBI_EmbedSecret}
      BoldBI__UserEmail: ${BBI_UserEmail}
      BoldBI__Environment: ${BBI_Environment:-onpremise}

      # ---- Keycloak SSO Authority & JWT ----
      Jwt__Key: ${JWT_KEY:-CHANGE_ME_jwt_signing_key_min_32_chars_xxxxxxxxxxxxxxxx}
      Jwt__Issuer: ${JWT_ISSUER:-BoldAdhoc}
      Jwt__Audience: ${JWT_AUDIENCE:-BoldAdhocUsers}
      Jwt__Authority: ${JWT_AUTHORITY:-https://keycloak.boldbidemo.com/realms/master}

    networks:
      - bdsadhoc-t1-net
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ---------------------------------------------------------------------------
  # 3. Nginx — TLS terminator + reverse proxy + static asset cache
  #    Exposes 8080 (HTTP) and 8443 (HTTPS) on the host.
  #    NOTE: 8443 chosen because host port 443 is already taken by `boldreports`.
  #          If you stop boldreports, change the HTTPS mapping to 443.
  # ---------------------------------------------------------------------------
  nginx:
    image: nginx:1.27-alpine
    container_name: bdsadhoc-t1-nginx
    restart: always
    depends_on:
      - bdsadhoc
    ports:
      - "8080:80"
      - "8443:443"
    volumes:
      # TLS certificates (bring your own — your .pem fullchain + .key)
      - ${TLS_CERT_FULLCHAIN_PATH}:/etc/nginx/certs/fullchain.pem:ro
      - ${TLS_CERT_KEY_PATH}:/etc/nginx/certs/privkey.pem:ro
      # Custom nginx config for prod
      - ./nginx/nginx.prod.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/default.prod.conf:/etc/nginx/conf.d/default.conf:ro
      - bdsadhoc-t1-nginx-cache:/var/cache/nginx
    networks:
      - bdsadhoc-t1-net
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

# -----------------------------------------------------------------------------
# Persistent volumes — all prefixed to avoid clashing with the host's existing
# bds-network containers (keycloak, boldreports, etc.)
# -----------------------------------------------------------------------------
volumes:
  bdsadhoc-t1-postgres-data:
    driver: local
  bdsadhoc-t1-nginx-cache:
    driver: local

# -----------------------------------------------------------------------------
# Network — new dedicated bridge, isolated from the host's existing networks
# -----------------------------------------------------------------------------
networks:
  bdsadhoc-t1-net:
    driver: bridge
    driver_opts:
      com.docker.network.bridge.name: br-bdsadhoc-t1
