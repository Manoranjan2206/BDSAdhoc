version: '3.8'

services:
  postgres-dev:
    image: postgres:16-alpine
    container_name: bdsadhoc-postgres-dev
    ports:
      # Using 5433 to avoid conflicts with existing postgres instances on 5432
      - "5433:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: Password123!
      POSTGRES_INITDB_ARGS: "-c max_connections=200"
    volumes:
      # Mount the SQL initialization scripts so they run automatically on the first boot
      - ./sql:/docker-entrypoint-initdb.d/:ro
      - postgres_dev_data:/var/lib/postgresql/data
    networks:
      - bds-network-dev
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always

volumes:
  postgres_dev_data:
    driver: local

networks:
  bds-network-dev:
    driver: bridge
    driver_opts:
      com.docker.network.bridge.name: br-bdsdev
