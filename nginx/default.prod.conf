# =============================================================================
#  BDSAdhoc Production Site — app.boldreportsdemo.com
#  - HTTP (80)  -> 301 redirect to HTTPS
#  - HTTPS (443) -> reverse-proxy to the bdsadhoc container
#  - TLS:       user-supplied cert (fullchain.pem + privkey.pem)
#  - HSTS,      http2, security headers, gzip, static caching
# =============================================================================

# ---------------------------------------------------------------------------
# HTTP -> HTTPS redirect
# ---------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name app.boldreportsdemo.com;

    # ACME http-01 challenge path (if you later switch to Let's Encrypt)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Health probe is still served on HTTP for orchestrators
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    # Everything else -> 301 to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# ---------------------------------------------------------------------------
# HTTPS — main app
# ---------------------------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name app.boldreportsdemo.com;

    charset utf-8;
    client_max_body_size 100M;

    # ---- TLS ----
    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 1.1.1.1 8.8.8.8 valid=300s;
    resolver_timeout 5s;

    # ---- HSTS — 1 year, include subdomains ----
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # ---- Logging ----
    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;

    # =====================================================================
    # Main SPA + API  (everything goes to the .NET app)
    # =====================================================================
    location / {
        proxy_pass http://app_backend;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Port  $server_port;
        proxy_set_header Connection        "";
        proxy_buffering off;
        proxy_request_buffering off;

        proxy_connect_timeout 60s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
        proxy_redirect off;

        # WebSocket support (e.g. for the Bold Reports viewer)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # =====================================================================
    # Auth login rate limit (tighter than the global api zone).
    # =====================================================================
    location /api/auth/login {
        limit_req zone=general_limit burst=5 nodelay;
        limit_req_status 429;

        proxy_pass http://app_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_send_timeout    30s;
        proxy_read_timeout    30s;
    }

    # =====================================================================
    # API rate limiting
    # =====================================================================
    location /api/ {
        limit_req zone=api_limit burst=100 nodelay;

        proxy_pass http://app_backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
        proxy_connect_timeout 30s;
        proxy_send_timeout    30s;
        proxy_read_timeout    30s;
    }

    # =====================================================================
    # Static assets (Vite emits content-hashed filenames — safe to cache)
    # =====================================================================
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        proxy_pass http://app_backend;
        proxy_cache_valid 200 30d;
        proxy_cache_bypass $http_pragma $http_authorization;
        add_header Cache-Control "public, max-age=2592000, immutable";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # =====================================================================
    # Health endpoint (also served over HTTPS for external probes)
    # =====================================================================
    location = /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    # =====================================================================
    # Deny hidden files
    # =====================================================================
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # =====================================================================
    # Custom error pages
    # =====================================================================
    error_page 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
