services:
  # =========================================================================
  # 1. Nginx Reverse Proxy (Entry Point - Multiple Container Deployment)
  # =========================================================================
  nginx:
    image: nginx:1.22-alpine
    container_name: bdsadhoc-nginx
    # Disabled - using separate ports for each service instead
    # ports:
    #   - "8000:80"
    #   - "8443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - nginx_cache:/var/cache/nginx
    environment:
      - NGINX_HOST=localhost
      - NGINX_PORT=80
    depends_on:
      - bdsadhoc
      - boldbi
      - boldreports
    networks:
      - bds-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # =========================================================================
  # 2. PostgreSQL Database Service (Shared for Bold BI and Bold Reports)
  # =========================================================================
  postgres:
    image: postgres:16-alpine
    container_name: bdsadhoc-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: Password123!
      POSTGRES_INITDB_ARGS: "-c max_connections=200"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - bds-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    # Note: Database exposed only internally via docker network
    # For development access: docker exec bdsadhoc-postgres psql -U postgres

  # =========================================================================
  # 3. Syncfusion Bold BI Service (Internal - No Direct Port Exposure)
  # =========================================================================
  boldbi:
    image: syncfusion/boldbi:latest
    container_name: bdsadhoc-boldbi
    ports:
      - "8080:80"
    environment:
      - APP_BASE_URL=http://boldbi:80
      - BOLD_SERVICES_HOSTING_ENVIRONMENT=docker
    volumes:
      - boldbi_app_data:/app/idp/app_data
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - bds-network
    restart: always
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    # Note: Accessed through Nginx reverse proxy at http://localhost/bi

  # =========================================================================
  # 4. Syncfusion Bold Reports Service (Internal - No Direct Port Exposure)
  # =========================================================================
  boldreports:
    image: syncfusion/boldreports:latest
    container_name: bdsadhoc-boldreports
    ports:
      - "8081:80"
    environment:
      - APP_BASE_URL=http://boldreports:80
      - BOLD_SERVICES_HOSTING_ENVIRONMENT=docker
    volumes:
      - boldreports_app_data:/app/idp/app_data
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - bds-network
    restart: always
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    # Note: Accessed through Nginx reverse proxy at http://localhost/reports

  # =========================================================================
  # 5. BDSAdhoc Application (.NET Backend + React Frontend - Internal)
  # =========================================================================
  bdsadhoc:
    build:
      context: .
      dockerfile: BoldAdhocEmbed.Server/Dockerfile
    container_name: bdsadhoc-app
    ports:
      - "5050:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:8080
      # Bold Reports Configuration - Points to CLOUD Bold Reports
      - BoldReports__ReportRootUrl=https://cloud.boldreports.com/reporting
      - BoldReports__ReportsSiteIdentifier=b1159702
      - BoldReports__AdminUser=manoranjan.rajendran@syncfusion.com
      - BoldReports__AdminPassword=Admin@123
      - BoldReports__EmbedSecret=Yhfw5o9c01TVdPk8HWhQQnGKAl0K9HP
      # Bold BI Configuration - Points to CLOUD Bold BI
      - BoldBI__ServerUrl=https://cloud.boldbi.com/bi
      - BoldBI__SiteIdentifier=b1159702
      - BoldBI__AdminUser=manoranjan.rajendran@syncfusion.com
      - BoldBI__AdminPassword=Admin@123
      - BoldBI__EmbedSecret=nhXoWeoMdDfCkSFD3AxiriqPLreL9VJe
      - BoldBI__UserEmail=manoranjan.rajendran@syncfusion.com
      - BoldBI__Environment=onpremise
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - bds-network
    restart: always
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    # Note: Accessed through Nginx reverse proxy at http://localhost/app

# =========================================================================
# Volumes Configuration (Persistent Data Storage)
# =========================================================================
volumes:
  postgres_data:
    driver: local

  boldbi_app_data:
    driver: local

  boldreports_app_data:
    driver: local

  nginx_cache:
    driver: local

# =========================================================================
# Networks Configuration (Service Communication)
# =========================================================================
networks:
  bds-network:
    driver: bridge
    driver_opts:
      com.docker.network.bridge.name: br-bdsadhoc
