services:
  # =========================================================================
  # 1. Nginx Reverse Proxy (Entry Point - Multiple Container Deployment)
  # =========================================================================
  nginx:
    image: nginx:1.22-alpine
    container_name: bdsadhoc-nginx
    # Disabled - using separate ports for each service instead
    # ports:
    #   - "8000:80"
    #   - "8443:443"
    volumes:
      - type: bind
        source: ./nginx/default.conf
        target: /etc/nginx/conf.d/default.conf
        read_only: true
      - type: bind
        source: ./nginx/nginx.conf
        target: /etc/nginx/nginx.conf
        read_only: true
      - nginx_cache:/var/cache/nginx
    environment:
      - NGINX_HOST=localhost
      - NGINX_PORT=80
    depends_on:
      - bdsadhoc
    networks:
      - bds-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # =========================================================================
  # 2. PostgreSQL Database Service (Shared for Bold BI and Bold Reports)
  # =========================================================================
  postgres:
    image: postgres:16-alpine
    container_name: bdsadhoc-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: Password123!
      POSTGRES_INITDB_ARGS: "-c max_connections=200"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - bds-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    # Note: Database exposed only internally via docker network
    # For development access: docker exec bdsadhoc-postgres psql -U postgres


  # =========================================================================
  # 5. BDSAdhoc Application (.NET Backend + React Frontend - Internal)
  # =========================================================================
  bdsadhoc:
    build:
      context: .
      dockerfile: BoldAdhocEmbed.Server/Dockerfile
    container_name: bdsadhoc-app
    ports:
      - "5050:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:8080
      # Required env vars (do NOT inline literals here; use .env or a
      # secrets manager). The previous draft hardcoded Admin@123 plus the
      # shared embed secret in plaintext, which is why this rewrite
      # parameterises everything.
      - BoldReports__ReportRootUrl=${BR_ReportRootUrl}
      - BoldReports__ReportsSiteIdentifier=${BR_SiteIdentifier}
      - BoldReports__AdminUser=${BR_AdminUser}
      - BoldReports__AdminPassword=${BR_AdminPassword}
      - BoldReports__EmbedSecret=${BR_EmbedSecret}
      - BoldBI__ServerUrl=${BBI_ServerUrl}
      - BoldBI__SiteIdentifier=${BBI_SiteIdentifier}
      - BoldBI__AdminUser=${BBI_AdminUser}
      - BoldBI__AdminPassword=${BBI_AdminPassword}
      - BoldBI__EmbedSecret=${BBI_EmbedSecret}
      - BoldBI__UserEmail=${BBI_UserEmail}
      - BoldBI__Environment=${BBI_Environment:-onpremise}
      - Jwt__Key=${JWT_KEY:-CHANGE_ME_jwt_signing_key_min_32_chars_xxxxxxxxxxxxxxxx}
      - Jwt__Issuer=${JWT_ISSUER:-BoldAdhoc}
      - Jwt__Audience=${JWT_AUDIENCE:-BoldAdhocUsers}
      - Jwt__Authority=${JWT_AUTHORITY:-https://keycloak.boldbidemo.com/realms/master}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - bds-network
    restart: always
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    # Note: Accessed through Nginx reverse proxy at http://localhost/app

# =========================================================================
# Volumes Configuration (Persistent Data Storage)
# =========================================================================
volumes:
  postgres_data:
    driver: local

  nginx_cache:
    driver: local

# =========================================================================
# Networks Configuration (Service Communication)
# =========================================================================
networks:
  bds-network:
    driver: bridge
    driver_opts:
      com.docker.network.bridge.name: br-bdsadhoc
